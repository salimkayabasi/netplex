<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetPlex - Netflix Top 10{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/netflex.css">
</head>
<body>
    <header class="navbar">
        <a href="/movies" class="brand">
            <span class="brand-logo">NETPLEX</span>
            <span class="brand-tag">TOP 10</span>
        </a>
        <div class="filter-bar">
            <button id="btn-landing-crawl" type="button" class="tab-btn tab-btn-crawl" onclick="triggerManualCrawlFromLanding()" title="Trigger Manual Crawl">
                <span class="btn-icon-wrapper">
                    <svg class="crawl-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                    </svg>
                </span>
                <span id="btn-landing-crawl-label">Sync & Crawl</span>
            </button>
            <a href="/settings" class="tab-btn tab-btn-link">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" style="vertical-align: -2px; margin-right: 4px;">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
                Settings
            </a>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Video Trailer Modal Overlay -->
    <div id="trailer-modal" class="modal-backdrop">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <h3 id="modal-media-title" class="modal-title">Trailer Player</h3>
                    <a id="modal-yt-btn" class="btn-watch-youtube" href="#" target="_blank" rel="noopener noreferrer" title="Watch on YouTube" aria-label="Watch on YouTube" style="display: none;">
                        <svg class="yt-icon" viewBox="0 0 24 24" width="28" height="20">
                            <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/>
                            <path fill="#FFFFFF" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </a>
                </div>
                <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <video id="modal-video-player" class="modal-video-player" controls preload="metadata"></video>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>NetPlex is an independent, non-commercial hobby project and is not affiliated, endorsed, or associated with Netflix, Inc., Plex, Inc., or YouTube, LLC / Google LLC. All trademarks belong to their respective owners.</p>
    </footer>

    <script src="/static/js/netflex.js"></script>
</body>
</html>
